<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZODOKU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="app">
        <div id="home-screen">
            <div class="card">
                <div class="header-bar"></div>
                <div class="center">
                    <h1>ZODOKU</h1>
                    <h2>Learn to solve step-by-step with beginner to advanced strategies and practice solving puzzles across 4 difficulties!</h2>
                    <div class="divider"></div>
                    <button class="btn-primary" onclick="showScreen('mode2-screen')">▶ Play</button>
                    <button class="btn-secondary" onclick="showScreen('mode1-screen')">🔍 Solve a Puzzle</button>
                </div>
            </div>
        </div>
        <div id="mode1-screen" class="hidden">
            <div class="mode1-container">
                <div class="mode1-header">
                    <button class="btn-back" onclick="showScreen('home-screen')">← Back</button>
                    <h2>ZODOKU SOLVER</h2>
                </div>

                <!-- Board -->
                <div class="board-wrapper">
                    <table class="sudoku-board" id="sudoku-board">
                    </table>
                </div>

                <!-- Strategy display -->
                <div class="strategy-display" id="strategy-display">
                    Enter your puzzle and click Solve
                </div>

                <!-- Step buttons -->
                <div class="step-buttons">
                    <button class="btn-step" id="btn-original" onclick="showOriginal()" disabled>⏮ Original</button>
                    <button class="btn-step" id="btn-prev" onclick="prevStep()" disabled>← Prev</button>
                    <button class="btn-step" id="btn-next" onclick="nextStep()" disabled>Next →</button>
                    <button class="btn-step" id="btn-final" onclick="showFinal()" disabled>Final ⏭</button>
                </div>

                <!-- Load button -->
                <button class="btn-primary" id="btn-solve" onclick="loadBoard()">Solve</button>

                <!-- Error message -->
                <p class="error-msg hidden" id="error-msg">Invalid board!</p>
            </div>
        </div>
        <div id="mode2-screen" class="hidden">
            <div class="mode2-container">

                <!-- Header -->
                <div class="mode2-header">
                    <button class="btn-back" onclick="showScreen('home-screen')">← Back</button>
                    <h2>ZODOKU</h2>
                </div>

                <!-- Difficulty selector -->
                <div class="difficulty-selector" id="difficulty-selector">
                    <button class="diff-btn active" onclick="selectDifficulty('easy', this)">Easy</button>
                    <button class="diff-btn" onclick="selectDifficulty('medium', this)">Medium</button>
                    <button class="diff-btn" onclick="selectDifficulty('hard', this)">Hard</button>
                    <button class="diff-btn" onclick="selectDifficulty('super hard', this)">Super Hard</button>
                </div>

                <!-- Timer -->
                <div class="timer-display" id="timer-display">0:00</div>

                <!-- Pause overlay wrapper: contains both board and overlay -->
                <div class="board-wrapper" id="mode2-board-wrapper">
                    <table class="sudoku-board" id="sudoku-board-2"></table>
                    <!-- Pause overlay sits on top of the board -->
                    <div class="pause-overlay" id="pause-overlay">
                        <p>Game Paused</p>
                        <button onclick="resumeGame()">Click to Resume</button>
                    </div>
                </div>

                <!-- Input mode toggle -->
                <div class="input-toggle">
                    <!-- clicking Normal sets inputMode to 'value' -->
                    <button class="toggle-btn active" id="toggle-value" onclick="setInputMode('value')">Normal</button>
                    <!-- clicking Notes sets inputMode to 'candidate' -->
                    <button class="toggle-btn" id="toggle-candidate" onclick="setInputMode('candidate')">Notes</button>
                </div>

                <!-- Number pad — click a number to select it, then click a cell -->
                <div class="number-pad" id="number-pad">
                    <button class="num-btn" onclick="selectNumber(1)">1</button>
                    <button class="num-btn" onclick="selectNumber(2)">2</button>
                    <button class="num-btn" onclick="selectNumber(3)">3</button>
                    <button class="num-btn" onclick="selectNumber(4)">4</button>
                    <button class="num-btn" onclick="selectNumber(5)">5</button>
                    <button class="num-btn" onclick="selectNumber(6)">6</button>
                    <button class="num-btn" onclick="selectNumber(7)">7</button>
                    <button class="num-btn" onclick="selectNumber(8)">8</button>
                    <button class="num-btn" onclick="selectNumber(9)">9</button>
                </div>

                <!-- Status message (shows errors from Check, or "Solved!") -->
                <div class="mode2-status" id="mode2-status"></div>

                <!-- Action buttons -->
                <div class="mode2-buttons">
                    <button class="btn-step" onclick="pauseGame()" id="btn-pause">⏸ Pause</button>
                    <button class="btn-step" onclick="resetGame()">↺ Reset</button>
                    <button class="btn-step" onclick="newPuzzle()">New</button>
                    <button class="btn-step" onclick="hintGame()">💡 Hint</button>
                    <button class="btn-step" onclick="checkGame()">✓ Check</button>
                    <button class="btn-step" onclick="solveGame()">⚡ Solve</button>
                </div>
            </div>
        </div>
        <!-- Ending overlay — outside all screens so fixed positioning works -->
    <div class="ending-overlay hidden" id="ending-overlay">
        <div class="ending-card">
            <div class="header-bar"></div>
            <div class="ending-content">
                <p class="ending-label">PUZZLE COMPLETE</p>
                <h1 class="ending-title">🎉</h1>
                <div class="ending-stats">
                    <div class="ending-stat">
                        <span class="stat-label">Time</span>
                        <span class="stat-value" id="ending-time">0:00</span>
                    </div>
                    <div class="ending-stat">
                        <span class="stat-label">Hints</span>
                        <span class="stat-value" id="ending-hints">0</span>
                    </div>
                    <div class="ending-stat">
                        <span class="stat-label">Checks</span>
                        <span class="stat-value" id="ending-checks">0</span>
                    </div>
                    <div class="ending-stat">
                        <span class="stat-label">Solved For Me</span>
                        <span class="stat-value" id="ending-solve">No</span>
                    </div>
                </div>
                <button class="btn-primary" onclick="newPuzzle(); hideEnding()">New Puzzle</button>
                <button class="btn-secondary" onclick="showScreen('home-screen'); hideEnding()">Home</button>
            </div>
        </div>
    </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
